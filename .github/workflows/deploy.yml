# Deploy to Vercel and PROVE the live surface matches what we just shipped.
#
# This workflow exists because of a real failure: commit dc683e0 applied the
# Anthropic brand sitewide, every test was green, and the deploy never ran — so
# the public demo served the pre-brand build for days while the README's
# above-the-fold link promised the new one. Merging is not shipping.
#
# One-time setup:
#   vercel link                       # in the repo, pick the kingdom-come project
#   gh secret set VERCEL_TOKEN     --body "<vercel.com/account/tokens>"
#   gh secret set VERCEL_ORG_ID    --body "<.vercel/project.json orgId>"
#   gh secret set VERCEL_PROJECT_ID --body "<.vercel/project.json projectId>"
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly live check: catches a rollback or a deploy that came back stale.
    - cron: "17 8 * * *"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Full suite (unit + API + WS + E2E + a11y + brand)
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # The gate that would have caught the original failure. Runs after every
  # deploy AND nightly on its own, against the URL a real visitor opens.
  verify-live:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Live demo serves the brand + chat this repo ships
        env:
          KC_CHECK_LIVE: "1"
        run: python -m pytest tests/test_demo_entry.py -v
